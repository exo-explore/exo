model_id = "mlx-community/Muse-Spark-Open-816B-A42B-3bit"
n_layers = 62
hidden_size = 8192
num_key_value_heads = 16
supports_tensor = true
tasks = ["TextGeneration"]
family = "muse_spark"
model_type = "muse_spark"
quantization = "3bit"
base_model = "Muse Spark Open"
# Muse Spark Open has no thinking switch: every turn starts with a reasoning message, and
# reasoning_effort sets how much (low, medium, high or xhigh; xhigh by default).
capabilities = ["text", "thinking"]
# The template sends the reasoning of every earlier assistant turn back.
reasoning_dialect = "post_last_user"
context_length = 1048576
# mlx-lm's Muse Spark runs custom Metal kernels.
backends = ["MlxMetal"]
[storage_size]
in_bytes = 436144269791

# Source: https://huggingface.co/meta-models/Muse-Spark-Open-816B-A42B (README, "Recommended
# inference parameters": temperature 1.0, top_p 1.0, top_k disabled). Licensed under the
# Muse Model License, which asks products built with the model to show "Built with Muse
# Spark Open".
[sampling_defaults]
temperature = 1.0
top_p = 1.0
