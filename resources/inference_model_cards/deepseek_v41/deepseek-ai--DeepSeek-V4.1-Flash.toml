# the two engram tables (203 GB) stay in the downloaded files, read while running.
[storage_size]
in_bytes = 510296708312
[memory_size]
in_bytes = 300155315648

# Source: https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash
[sampling_defaults]
temperature = 1.0
top_p = 1.0
