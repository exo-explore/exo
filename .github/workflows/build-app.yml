name: Build EXO Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - "main"
      - "test-app"

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            runner: macos-26
            artifact_suffix: dmg
          - name: linux
            runner: ubuntu-latest
            artifact_suffix: deb
          - name: windows
            runner: windows-latest
            artifact_suffix: exe
    env:
      SPARKLE_VERSION: 2.9.0-beta.1
      SPARKLE_DOWNLOAD_PREFIX: ${{ secrets.SPARKLE_DOWNLOAD_PREFIX }}
      SPARKLE_FEED_URL: ${{ secrets.SPARKLE_FEED_URL }}
      SPARKLE_ED25519_PUBLIC: ${{ secrets.SPARKLE_ED25519_PUBLIC }}
      SPARKLE_ED25519_PRIVATE: ${{ secrets.SPARKLE_ED25519_PRIVATE }}
      SPARKLE_S3_BUCKET: ${{ secrets.SPARKLE_S3_BUCKET }}
      SPARKLE_S3_PREFIX: ${{ secrets.SPARKLE_S3_PREFIX }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      EXO_BUILD_NUMBER: ${{ github.run_number }}
      EXO_LIBP2P_NAMESPACE: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive release version from tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == "test-app" || "${{ github.event_name }}" == "workflow_dispatch" || "$GITHUB_REF_TYPE" != "tag" ]]; then
            VERSION="0.0.0-alpha.0"
            echo "IS_ALPHA=true" >> $GITHUB_ENV
          else
            VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$VERSION" == *-alpha* ]]; then
              echo "IS_ALPHA=true" >> $GITHUB_ENV
            else
              echo "IS_ALPHA=false" >> $GITHUB_ENV
            fi
          fi
          echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Compute build version from semver
        shell: bash
        run: |
          VERSION="$RELEASE_VERSION"
          BASE_VERSION="${VERSION%%-*}"
          MAJOR=$(echo "$BASE_VERSION" | cut -d. -f1)
          MINOR=$(echo "$BASE_VERSION" | cut -d. -f2)
          PATCH=$(echo "$BASE_VERSION" | cut -d. -f3)

          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE_PART="${VERSION#*-}"
            PRERELEASE_NUM="${PRERELEASE_PART##*.}"
            if ! [[ "$PRERELEASE_NUM" =~ ^[0-9]+$ ]]; then
              PRERELEASE_NUM=0
            fi
          else
            PRERELEASE_NUM=999
          fi

          BUILD_VERSION=$((PRERELEASE_NUM + 1000 * PATCH + 1000000 * MINOR + 1000000000 * MAJOR))
          echo "EXO_BUILD_VERSION=$BUILD_VERSION" >> $GITHUB_ENV
          echo "Computed build version: $BUILD_VERSION from $VERSION"

      - name: Ensure tag commit is on main
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          git fetch origin main
          if [[ "$IS_ALPHA" == "true" ]]; then
            echo "Alpha tag detected, skipping main branch check"
          elif ! git merge-base --is-ancestor origin/main HEAD; then
            echo "Production tag must point to a commit on main"
            exit 1
          fi

      - name: Fetch and validate release notes
        if: github.ref_type == 'tag' && matrix.name == 'macos'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          echo "Looking for draft release named '$GITHUB_REF_NAME'..."
          DRAFT_EXISTS=$(gh release list --json name,isDraft --jq ".[] | select(.isDraft == true) | select(.name == \"$GITHUB_REF_NAME\") | .name" 2>/dev/null || echo "")

          if [[ -z "$DRAFT_EXISTS" ]]; then
            if [[ "$IS_ALPHA" == "true" ]]; then
              echo "No draft release found for alpha tag (optional)"
              echo "HAS_RELEASE_NOTES=false" >> $GITHUB_ENV
              exit 0
            fi
            echo "ERROR: No draft release found for tag $GITHUB_REF_NAME"
            exit 1
          fi

          RELEASE_JSON=$(gh api repos/${{ github.repository }}/releases --jq ".[] | select(.draft == true) | select(.name == \"$GITHUB_REF_NAME\")" 2>/dev/null || echo "")
          NOTES=$(echo "$RELEASE_JSON" | jq -r '.body // ""')
          if [[ -z "$NOTES" || "$NOTES" == "null" ]]; then
            if [[ "$IS_ALPHA" == "true" ]]; then
              echo "Draft release has no notes"
              echo "HAS_RELEASE_NOTES=false" >> $GITHUB_ENV
              exit 0
            fi
            echo "ERROR: Draft release exists but has no release notes"
            exit 1
          fi

          RELEASE_ID=$(echo "$RELEASE_JSON" | jq -r '.id')
          echo "DRAFT_RELEASE_ID=$RELEASE_ID" >> $GITHUB_ENV
          echo "HAS_RELEASE_NOTES=true" >> $GITHUB_ENV
          echo "$NOTES" > /tmp/release_notes.md
          echo "RELEASE_NOTES_FILE=/tmp/release_notes.md" >> $GITHUB_ENV

      # ============================================================
      # Install Dependencies (Multi-Platform)
      # ============================================================

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Configure Cachix
        uses: cachix/cachix-action@v14
        with:
          name: exo
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build Dashboard
        shell: bash
        run: |
          DASHBOARD_OUT=$(nix build .#dashboard --print-build-logs --no-link --print-out-paths)
          mkdir -p dashboard/build
          cp -r "$DASHBOARD_OUT"/* dashboard/build/

      - name: Install Sparkle CLI (macOS only)
        if: matrix.name == 'macos'
        run: |
          CLI_URL="https://github.com/sparkle-project/Sparkle/releases/download/${{ env.SPARKLE_VERSION }}/Sparkle-${{ env.SPARKLE_VERSION }}.tar.xz"
          mkdir -p /tmp/sparkle
          curl --fail --location --output /tmp/sparkle.tar.xz "$CLI_URL"
          tar -xJf /tmp/sparkle.tar.xz -C /tmp/sparkle --strip-components=1
          echo "SPARKLE_BIN=/tmp/sparkle/bin" >> $GITHUB_ENV

      - name: Select Xcode (macOS only)
        if: matrix.name == 'macos'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app
          if ! xcrun -f metal >/dev/null 2>&1; then
            echo "Metal toolchain is not installed."
            exit 1
          fi

      - name: Install System Dependencies (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rubygems build-essential
          sudo gem install fpm

      - name: Install UV
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Setup Python
        shell: bash
        run: |
          uv python install
          uv sync --locked

      - name: Install Inno Setup (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          choco install innosetup --version=6.2.2 -y

      # ============================================================
      # Pre-flight credential / profile validation (macOS only)
      # ============================================================

      - name: Prepare macOS Signing Keychain
        if: matrix.name == 'macos'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
        run: |
          KEYCHAIN_PATH="$HOME/Library/Keychains/build.keychain-db"
          security create-keychain -p "$MACOS_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"

          echo "$MACOS_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          rm /tmp/cert.p12

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          echo "$PROVISIONING_PROFILE" | base64 --decode > "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/EXO.provisionprofile"
          echo "BUILD_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV

      - name: Validate Apple notarization credentials
        if: matrix.name == 'macos'
        env:
          APPLE_NOTARIZATION_USERNAME: ${{ secrets.APPLE_NOTARIZATION_USERNAME }}
          APPLE_NOTARIZATION_PASSWORD: ${{ secrets.APPLE_NOTARIZATION_PASSWORD }}
          APPLE_NOTARIZATION_TEAM: ${{ secrets.APPLE_NOTARIZATION_TEAM }}
        run: |
          CRED_COUNT=0
          for v in "$APPLE_NOTARIZATION_USERNAME" "$APPLE_NOTARIZATION_PASSWORD" "$APPLE_NOTARIZATION_TEAM"; do
            [[ -n "$v" ]] && CRED_COUNT=$((CRED_COUNT + 1))
          done
          if [[ "$CRED_COUNT" -eq 0 ]]; then
            echo "No notarization credentials configured — skipping notarization."
            exit 0
          fi
          if [[ "$CRED_COUNT" -ne 3 ]]; then
            echo "ERROR: partial notarization credentials set."
            exit 1
          fi
          xcrun notarytool history \
            --apple-id "$APPLE_NOTARIZATION_USERNAME" \
            --password "$APPLE_NOTARIZATION_PASSWORD" \
            --team-id "$APPLE_NOTARIZATION_TEAM" >/dev/null

      # ============================================================
      # Compilation and Packaging
      # ============================================================

      - name: Add pinned macmon to PATH (macOS only)
        if: matrix.name == 'macos'
        run: |
          MACMON_DIR=$(nix develop --command sh -c 'dirname $(which macmon)')
          echo "$MACMON_DIR" >> $GITHUB_PATH

      - name: Build PyInstaller bundle
        run: uv run pyinstaller packaging/pyinstaller/exo.spec

      # macOS Specific Build
      - name: Build macOS Swift App and Inject Runtime
        if: matrix.name == 'macos'
        env:
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SPARKLE_FEED_URL: ${{ secrets.SPARKLE_FEED_URL }}
          SPARKLE_ED25519_PUBLIC: ${{ secrets.SPARKLE_ED25519_PUBLIC }}
        run: |
          cd app/EXO
          security unlock-keychain -p "$MACOS_CERTIFICATE_PASSWORD" "$BUILD_KEYCHAIN_PATH"
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$BUILD_KEYCHAIN_PATH" | awk -F '"' '{print $2}')
          xcodebuild clean build \
            -scheme EXO \
            -configuration Release \
            -derivedDataPath build \
            MARKETING_VERSION="$RELEASE_VERSION" \
            CURRENT_PROJECT_VERSION="$EXO_BUILD_VERSION" \
            EXO_BUILD_TAG="$RELEASE_VERSION" \
            EXO_BUILD_COMMIT="$GITHUB_SHA" \
            SPARKLE_FEED_URL="$SPARKLE_FEED_URL" \
            SPARKLE_ED25519_PUBLIC="$SPARKLE_ED25519_PUBLIC" \
            CODE_SIGNING_IDENTITY="$SIGNING_IDENTITY" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=YES
          mkdir -p ../../output
          cp -R build/Build/Products/Release/EXO.app ../../output/EXO.app

          cd ../..
          rm -rf output/EXO.app/Contents/Resources/exo
          mkdir -p output/EXO.app/Contents/Resources
          cp -R dist/exo output/EXO.app/Contents/Resources/exo

      - name: Codesign and Notarize macOS App
        if: matrix.name == 'macos'
        env:
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_NOTARIZATION_USERNAME: ${{ secrets.APPLE_NOTARIZATION_USERNAME }}
          APPLE_NOTARIZATION_PASSWORD: ${{ secrets.APPLE_NOTARIZATION_PASSWORD }}
          APPLE_NOTARIZATION_TEAM: ${{ secrets.APPLE_NOTARIZATION_TEAM }}
        run: |
          cd output
          security unlock-keychain -p "$MACOS_CERTIFICATE_PASSWORD" "$BUILD_KEYCHAIN_PATH"
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$BUILD_KEYCHAIN_PATH" | awk -F '"' '{print $2}')

          find EXO.app/Contents/Resources/exo -type f \( -perm -111 -o -name "*.dylib" -o -name "*.so" \) -print0 |
            while IFS= read -r -d '' file; do
              /usr/bin/codesign --force --timestamp --options runtime --sign "$SIGNING_IDENTITY" "$file"
            done

          /usr/bin/codesign --deep --force --timestamp --options runtime --sign "$SIGNING_IDENTITY" EXO.app

          mkdir -p dmg-root
          cp -R EXO.app dmg-root/
          ln -s /Applications dmg-root/Applications
          DMG_NAME="EXO-${RELEASE_VERSION}.dmg"
          hdiutil create -volname "EXO" -srcfolder dmg-root -ov -format UDZO "$DMG_NAME"
          /usr/bin/codesign --force --timestamp --options runtime --sign "$SIGNING_IDENTITY" "$DMG_NAME"

          if [[ -n "$APPLE_NOTARIZATION_USERNAME" ]]; then
            xcrun notarytool submit "$DMG_NAME" \
              --apple-id "$APPLE_NOTARIZATION_USERNAME" \
              --password "$APPLE_NOTARIZATION_PASSWORD" \
              --team-id "$APPLE_NOTARIZATION_TEAM" \
              --wait --timeout 15m
            xcrun stapler staple "$DMG_NAME"
          fi

      # Linux Specific Build
      - name: Create Debian Package (Linux)
        if: matrix.name == 'linux'
        run: |
          mkdir -p output
          echo '#!/bin/sh' > postinst
          echo 'ln -sf /usr/local/share/exo/exo /usr/bin/exo' >> postinst
          chmod +x postinst
          fpm -s dir -t deb \
            -n exo \
            -v "$RELEASE_VERSION" \
            --prefix /usr/local/share/exo \
            --after-install postinst \
            --deb-changelog /dev/null \
            -C ./dist/exo .
          mv *.deb output/exo-${RELEASE_VERSION}.deb

      # Windows Specific Build
      - name: Create Windows Installer (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output
          $issContent = @"
          [Setup]
          AppName=Exo
          AppVersion=${env:RELEASE_VERSION}
          DefaultDirName={pf}\Exo
          DefaultGroupName=Exo
          UninstallDisplayIcon={app}\exo.exe
          Compression=lzma2
          SolidCompression=yes
          OutputDir=output
          OutputBaseFilename=EXO-${env:RELEASE_VERSION}

          [Files]
          Source: "dist\exo\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\Exo"; Filename: "{app}\exo.exe"
          Name: "{commondesktop}\Exo"; Filename: "{app}\exo.exe"
          "@
          Set-Content -Path "setup.iss" -Value $issContent
          & "iscc" setup.iss
          Move-Item -Path "output\EXO-${env:RELEASE_VERSION}.exe" -Destination "output\EXO-${env:RELEASE_VERSION}.exe"

      # ============================================================
      # Post-Packaging: Sparkle and Upload Artifacts
      # ============================================================

      - name: Generate Sparkle appcast (macOS only)
        if: matrix.name == 'macos'
        env:
          SPARKLE_DOWNLOAD_PREFIX: ${{ env.SPARKLE_DOWNLOAD_PREFIX }}
          SPARKLE_ED25519_PRIVATE: ${{ secrets.SPARKLE_ED25519_PRIVATE }}
          IS_ALPHA: ${{ env.IS_ALPHA }}
        run: |
          cd output
          DOWNLOAD_PREFIX="${SPARKLE_DOWNLOAD_PREFIX:-https://assets.exolabs.net}"
          echo "$SPARKLE_ED25519_PRIVATE" > sparkle_ed25519.key
          chmod 600 sparkle_ed25519.key

          CHANNEL_FLAG=""
          if [[ "$IS_ALPHA" == "true" ]]; then
            CHANNEL_FLAG="--channel alpha"
          fi

          $SPARKLE_BIN/generate_appcast \
            --ed-key-file sparkle_ed25519.key \
            --download-url-prefix "$DOWNLOAD_PREFIX" \
            $CHANNEL_FLAG \
            .

      - name: Inject release notes into appcast (macOS only)
        if: github.ref_type == 'tag' && env.HAS_RELEASE_NOTES == 'true' && matrix.name == 'macos'
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          export NOTES=$(cat "$RELEASE_NOTES_FILE")
          awk '
            /<enclosure[^>]*>/ && index($0, ENVIRON["RELEASE_VERSION"]) {
              print
              print "            <description sparkle:format=\"markdown\"><![CDATA["
              print ENVIRON["NOTES"]
              print "            ]]></description>"
              next
            }
            { print }
          ' output/appcast.xml > output/appcast.xml.tmp && mv output/appcast.xml.tmp output/appcast.xml

      - name: Upload Local Artifact
        uses: actions/upload-artifact@v4
        with:
          name: exo-${{ matrix.name }}-${{ env.RELEASE_VERSION }}
          path: output/*

      - name: Upload to S3 (macOS/Linux/Windows targets)
        if: env.SPARKLE_S3_BUCKET != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ env.AWS_REGION }}
          SPARKLE_S3_BUCKET: ${{ env.SPARKLE_S3_BUCKET }}
          SPARKLE_S3_PREFIX: ${{ env.SPARKLE_S3_PREFIX }}
          IS_ALPHA: ${{ env.IS_ALPHA }}
        shell: bash
        run: |
          cd output
          PREFIX="${SPARKLE_S3_PREFIX:-}"
          if [[ -n "$PREFIX" && "${PREFIX: -1}" != "/" ]]; then
            PREFIX="${PREFIX}/"
          fi

          TARGET_FILE=$(find . -maxdepth 1 -type f \( -name "*.dmg" -o -name "*.deb" -o -name "*.exe" \) | head -n 1 | xargs basename)

          if [[ "${{ github.ref_type }}" != "tag" ]]; then
            aws s3 cp "$TARGET_FILE" "s3://${SPARKLE_S3_BUCKET}/${PREFIX}${TARGET_FILE%.*}-${GITHUB_SHA}.${matrix.artifact_suffix}"
            exit 0
          fi

          aws s3 cp "$TARGET_FILE" "s3://${SPARKLE_S3_BUCKET}/${PREFIX}${TARGET_FILE}"
          
          if [[ "${{ matrix.name }}" == "macos" && "$IS_ALPHA" != "true" ]]; then
            aws s3 cp "$TARGET_FILE" "s3://${SPARKLE_S3_BUCKET}/${PREFIX}EXO-latest.dmg"
            aws s3 cp appcast.xml "s3://${SPARKLE_S3_BUCKET}/${PREFIX}appcast.xml" --content-type application/xml --cache-control no-cache
          fi

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        shell: bash
        run: |
          TARGET_FILE=$(find output -maxdepth 1 -type f \( -name "*.dmg" -o -name "*.deb" -o -name "*.exe" \) | head -n 1)
          
          if [[ "${{ matrix.name }}" == "macos" && "$HAS_RELEASE_NOTES" == "true" ]]; then
            gh api --method PATCH "repos/${{ github.repository }}/releases/$DRAFT_RELEASE_ID" \
              -f tag_name="$GITHUB_REF_NAME" \
              -F draft=false
          fi
          
          gh release upload "$GITHUB_REF_NAME" "$TARGET_FILE" --clobber || echo "Release upload complete"
