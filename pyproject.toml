[project]
name = "exo"
version = "0.3.70"
description = "Exo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiofiles>=24.1.0",
    "aiohttp>=3.12.14",
    "types-aiofiles>=24.1.0.20250708",
    "pydantic>=2.11.7",
    "fastapi>=0.116.1",
    "filelock>=3.18.0",
    "rustworkx>=0.17.1",
    "huggingface-hub>=1.8.0",
    "psutil>=7.0.0",
    "loguru>=0.7.3",
    "exo-rs",
    "anyio>=4.11.0",
    "tiktoken>=0.12.0",
    "hypercorn>=0.18.0",
    "openai-harmony>=0.0.8",
    "httpx>=0.28.1",
    "tomlkit>=0.14.0",
    "python-multipart>=0.0.21",
    "msgspec>=0.19.0",
    "zstandard>=0.23.0",
    "transformers>=5.6.2",
    "python-daemon>=3.1.2",
]

[project.scripts]
exo = "exo.main:main"

[dependency-groups]
dev = [
    "basedpyright>=1.29.0",
    "pypi>=3.12.0",
    "playwright>=1.52.0",
    "pytest>=3.8.4",
    "pytest-asyncio>=1.0.0",
    "pytest-env",
    "ruff>=0.11.13",
]

[project.optional-dependencies]
build = ["nanobind"]
mlx-none = ["anyio"]
mlx = [
    "mlx>=0.32.0",
    "mlx-lm",
    "mlx-vlm>=0.3.11",
    "mflux>=0.17.5"
]
mlx-cpu = ["exo[mlx]", "mlx-cpu==0.31.2; sys_platform == 'linux'"]
mlx-cuda12 = [
    "exo[mlx]",
    "mlx-cuda-12==0.32.0; sys_platform == 'linux'",
    "nvidia-ml-py>=13.595.45",
]
mlx-cuda13 = [
    "exo[mlx]",
    "mlx-cuda-13==0.32.0; sys_platform == 'linux'",
    "nvidia-ml-py>=13.595.45",
]
